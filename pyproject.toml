[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ragscan"
version = "0.1.0"
description = "Scan RAG knowledge bases for poisoned documents and hidden prompt injections, and trace bad answers back to the documents that caused them."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
keywords = ["rag", "llm", "security", "prompt-injection", "data-poisoning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
st = ["sentence-transformers>=2.2"]
dev = ["pytest>=7"]

[project.scripts]
ragscan = "ragscan.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ragscan"]

[tool.pytest.ini_options]
testpaths = ["tests"]
