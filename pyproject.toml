[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentdetox"
version = "0.1.0"
description = "Poisoning protection for what AI agents know: detect, block and clean planted instructions and fabricated facts in agent memory, rules and knowledge bases."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
keywords = ["ai-agents", "agent-memory", "rag", "llm", "security", "prompt-injection", "data-poisoning", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Intended Audience :: Developers",
]

[project.optional-dependencies]
st = ["sentence-transformers>=2.2"]
nli = ["transformers>=4.40", "torch>=2.1"]
dev = ["pytest>=7"]

[project.scripts]
agentdetox = "agentdetox.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdetox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
