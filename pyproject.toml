[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentdetox"
dynamic = ["version"]
description = "Check risky writes to coding agents' memory, instructions, skills and config. Review changes and source evidence, then restore earlier versions."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Yichen Wu"}]
requires-python = ">=3.11"
# json5 reads OpenClaw's config, which is documented as JSON5; it is imported only for a file that is not plain JSON.
# numpy is not here: only the knowledge-base scanner and the optional contradiction model
# use it, and a hook installed through `uvx` should not have to download it.
dependencies = ["json5>=0.9.25"]
keywords = ["ai-agents", "agent-memory", "claude-code", "rag", "llm", "security", "prompt-injection",
            "data-poisoning", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/chriswu727/agentdetox"
Issues = "https://github.com/chriswu727/agentdetox/issues"
Changelog = "https://github.com/chriswu727/agentdetox/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# `agentdetox scan` (with passage comparison) and `agentdetox trace`.
kb = ["numpy>=1.24"]
st = ["numpy>=1.24", "sentence-transformers>=2.2"]
nli = ["numpy>=1.24", "transformers>=4.40", "torch>=2.1"]
dev = ["numpy>=1.24", "pytest>=7", "ruff>=0.15", "mypy>=1.18", "pip-audit>=2.7", "hypothesis>=6"]

[project.scripts]
agentdetox = "agentdetox.entrypoint:main"

[tool.hatch.version]
path = "src/agentdetox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdetox"]

[tool.hatch.build.targets.sdist]
# A list of what may ship, not of what may not: hatch reads .gitignore but not
# .git/info/exclude, so private files kept out of git that way would be uploaded.
only-include = ["src", "tests", "CHANGELOG.md", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "lab"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
# B: likely bugs. BLE: an `except Exception` has to say why (`# noqa: BLE001 - reason`).
# PLE: errors, among them invisible and direction-changing characters in source.
select = ["E4", "E7", "E9", "F", "I", "B", "BLE", "PLE"]
# zip() over lists built together a few lines above; strict= would say nothing new.
ignore = ["B905"]

[tool.ruff.lint.per-file-ignores]
# These hold the invisible characters they look for, or test with.
"src/agentdetox/hidden.py" = ["PLE2502", "PLE2515"]
"tests/*" = ["PLE2502", "PLE2515"]
"bench/compare.py" = ["PLE2502", "PLE2515"]

[tool.mypy]
python_version = "3.11"
files = ["src/agentdetox"]
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[[tool.mypy.overrides]]
# Optional extras, imported only where a feature that needs them runs.
module = ["torch.*", "transformers.*", "huggingface_hub.*", "sentence_transformers.*"]
ignore_missing_imports = true
