[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentdetox"
dynamic = ["version"]
description = "Protection for what AI coding agents remember and obey: checks what they write to memory, rules, skills and config, records where each change came from, and puts back what was tampered with."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{name = "Yichen Wu"}]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
keywords = ["ai-agents", "agent-memory", "claude-code", "rag", "llm", "security", "prompt-injection",
            "data-poisoning", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/chriswu727/agentdetox"
Issues = "https://github.com/chriswu727/agentdetox/issues"
Changelog = "https://github.com/chriswu727/agentdetox/blob/main/CHANGELOG.md"

[project.optional-dependencies]
st = ["sentence-transformers>=2.2"]
nli = ["transformers>=4.40", "torch>=2.1"]
dev = ["pytest>=7", "ruff>=0.15", "mypy>=1.18", "pip-audit>=2.7"]

[project.scripts]
agentdetox = "agentdetox.cli:main"

[tool.hatch.version]
path = "src/agentdetox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdetox"]

[tool.hatch.build.targets.sdist]
# A list of what may ship, not of what may not: hatch reads .gitignore but not
# .git/info/exclude, so private files kept out of git that way would be uploaded.
only-include = ["src", "tests", "CHANGELOG.md", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests", "lab"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
# The hook path's contracts, typed strictly first; the rest of the package follows.
files = ["src/agentdetox/engine.py", "src/agentdetox/policy.py", "src/agentdetox/adapters.py",
         "src/agentdetox/context.py", "src/agentdetox/shell.py", "src/agentdetox/compat.py",
         "src/agentdetox/settings.py", "src/agentdetox/hooks.py", "src/agentdetox/session.py",
         "src/agentdetox/storage.py", "src/agentdetox/review.py", "src/agentdetox/ledger.py",
         "src/agentdetox/integrity.py", "src/agentdetox/review_ui.py", "src/agentdetox/observation.py"]
follow_imports = "silent"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true
