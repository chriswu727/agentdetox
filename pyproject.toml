[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentdetox"
dynamic = ["version"]
description = "Poisoning protection for what AI agents know: detect, block and clean planted instructions and fabricated facts in agent memory, rules and knowledge bases."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["numpy>=1.24"]
keywords = ["ai-agents", "agent-memory", "claude-code", "rag", "llm", "security", "prompt-injection",
            "data-poisoning", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/chriswu727/agentdetox"
Issues = "https://github.com/chriswu727/agentdetox/issues"
Changelog = "https://github.com/chriswu727/agentdetox/blob/main/CHANGELOG.md"

[project.optional-dependencies]
st = ["sentence-transformers>=2.2"]
nli = ["transformers>=4.40", "torch>=2.1"]
dev = ["pytest>=7"]

[project.scripts]
agentdetox = "agentdetox.cli:main"

[tool.hatch.version]
path = "src/agentdetox/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentdetox"]

[tool.hatch.build.targets.sdist]
# A list of what may ship, not of what may not: hatch reads .gitignore but not
# .git/info/exclude, so private files kept out of git that way would be uploaded.
only-include = ["src", "tests", "CHANGELOG.md", "LICENSE", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
