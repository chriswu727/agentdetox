name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install build and test dependencies
        run: python -m pip install --upgrade pip 'setuptools>=84.1' certifi && python -m pip install build twine -e '.[dev]'
      - name: Verify release metadata
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python scripts/check_release.py "$RELEASE_TAG"
      - name: Audit installed dependencies
        run: |
          python -m pip check
          python -m pip_audit --vulnerability-service osv --progress-spinner off --skip-editable
      - name: Static checks and tests
        run: |
          ruff check src tests bench scripts lab
          mypy
          python -m pytest -q
      - name: Check prevention, monitoring and recovery regressions
        run: python bench/accuracy_eval.py
      - name: Build and check distributions
        run: |
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_dist.py dist/*
      - name: Exercise the installed wheel lifecycle
        run: python scripts/check_journey.py dist/*.whl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error

  github-assets:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-package-distributions
          path: dist
      - name: Attach distributions to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/agentdetox/
    permissions:
      id-token: write

    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: python-package-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
