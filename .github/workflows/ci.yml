name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python-version: "3.11"}
          - {os: ubuntu-latest, python-version: "3.12"}
          - {os: macos-latest, python-version: "3.12"}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install --upgrade pip 'setuptools>=84.1' certifi && python -m pip install -e '.[dev]'
      - name: Smoke-test the command and the hook path
        run: |
          python -m pip check
          agentdetox --version
          agentdetox demo
      - name: Audit installed dependencies
        run: python -m pip_audit --vulnerability-service osv --progress-spinner off --skip-editable
      - name: Static checks
        run: |
          ruff check src tests bench scripts lab
          mypy
      - name: Run tests
        run: python -m pytest -q
      - name: Check offline detection and recovery regressions
        run: |
          python bench/accuracy_eval.py
          python -m bench.acceptance_eval
      - name: Check distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_dist.py dist/*
      - name: Exercise the installed wheel lifecycle
        run: python scripts/check_journey.py dist/*.whl

  windows:
    name: Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package
        run: python -m pip install --upgrade pip 'setuptools>=84.1' certifi && python -m pip install -e '.[dev]'
      - name: Smoke-test the hook path
        run: agentdetox demo
      - name: Run tests
        run: python scripts/check.py
      - name: Check offline detection and recovery regressions
        run: |
          python -X utf8 bench/accuracy_eval.py
          python -X utf8 -m bench.acceptance_eval
      - name: Build and check distributions and installed wheel lifecycle
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check --strict dist/*
          python scripts/check_dist.py dist/*
          python -X utf8 scripts/check_journey.py dist/*.whl
